spring:
  application:
    name: ${APP_NAME:product}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:first_product_group}
      auto-offset-reset: ${KAFKA_CONSUMER_AUTO_OFFSET_RESET:earliest}
      enable-auto-commit: ${KAFKA_CONSUMER_ENABLE_AUTO_COMMIT:false}
      auto-commit-interval: ${KAFKA_CONSUMER_AUTO_COMMIT_INTERVAL:100}
      value-default-type: ${KAFKA_CONSUMER_VALUE_DEFAULT_TYPE:com.serjnn.ProductService.dtos.DiscountChangesDto}
      trusted-packages: ${KAFKA_CONSUMER_TRUSTED_PACKAGES:*}
      max-poll-records: ${KAFKA_CONSUMER_MAX_POLL_RECORDS:50}
    producer:
      acks: ${KAFKA_PRODUCER_ACKS:all}
    listener:
      observation-enabled: true
    template:
      observation-enabled: true
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: ${FLYWAY_BASELINE:true}
    schemas: product_schema
    default-schema: product_schema
    create-schemas: true
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/micr-db?currentSchema=product_schema}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      schema: product_schema
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  services:
    discount-url: ${DISCOUNT_SERVICE_URL:http://discount/api/v1/discounts/}
  kafka:
    topic:
      discount-notifications: ${KAFKA_TOPIC_DISCOUNT_NOTIFICATIONS:discountNotifTopic}
      discount-notifications-partitions: ${KAFKA_TOPIC_DISCOUNT_NOTIFICATIONS_PARTITIONS:3}
      discount-changes: ${KAFKA_TOPIC_DISCOUNT_CHANGES:discountChangesTopic}
  notifier:
    page-size: ${NOTIFIER_PAGE_SIZE:100}
    core-pool-size: ${NOTIFIER_CORE_POOL_SIZE:10}
    max-pool-size: ${NOTIFIER_MAX_POOL_SIZE:50}
    queue-capacity: ${NOTIFIER_QUEUE_CAPACITY:10000}

springdoc:
  api-docs:
    path: ${SPRINGDOC_API_DOCS_PATH:/api-docs}
  swagger-ui:
    path: ${SPRINGDOC_SWAGGER_UI_PATH:/swagger-ui.html}
    operations-sorter: alpha
    tags-sorter: alpha

server:
  port: ${SERVER_PORT:7022}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
  metrics:
    tags:
      application: product
    distribution:
      percentiles-histogram:
        http.server.requests: true
        kafka.consumer.fetch.manager.fetch.latency: true
        kafka.producer.request.latency: true



eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: ${EUREKA_INSTANCE_PREFER_IP:true}

kind: Application

resilience4j:
  circuitbreaker:
    instances:
      discountService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowType: COUNT_BASED
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
  retry:
    instances:
      discountService:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
